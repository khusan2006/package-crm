<div class="xshops-row" data-xshops-row>
  <input type="hidden" name="{{ name }}_id" value="{{ row.id }}">
  <div class="xshops-head">
    <input type="text" name="{{ name }}_note" value="{{ row.note }}" maxlength="200" placeholder="Qaysi do'kon — masalan, Chorsu bozori, 2-do'kon" aria-label="Do'kon izohi" autocomplete="off">
    <button type="button" class="icon-action xphones-remove" data-xshops-remove title="Do'konni olib tashlash" aria-label="Do'konni olib tashlash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  {{ row.picker }}
</div>
